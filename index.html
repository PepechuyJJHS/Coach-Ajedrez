<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coach IA de Ajedrez V5 - Animado</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg: #121212;
            --card: #1e1e1e;
            --text: #e0e0e0;
            --highlight: #ff8c00;
            --accent: #333333;
        }
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }
        
        /* --- ANIMACIONES --- */
        @keyframes slideUpFade {
            0% { opacity: 0; transform: translateY(40px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        @keyframes pulseGlow {
            0% { box-shadow: 0 0 5px var(--highlight); transform: scale(1); }
            50% { box-shadow: 0 0 20px var(--highlight); transform: scale(1.02); }
            100% { box-shadow: 0 0 5px var(--highlight); transform: scale(1); }
        }
        @keyframes slideDownResult {
            0% { opacity: 0; transform: translateY(-20px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        /* ------------------- */

        .header {
            text-align: center;
            margin-bottom: 20px;
            animation: slideUpFade 0.6s ease-out;
        }
        .header h1 { margin: 0; color: #fff; font-size: 1.8rem; text-shadow: 0 2px 10px rgba(255, 140, 0, 0.3); }
        .header p { color: #888; font-size: 0.9rem; }
        
        .dashboard {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            max-width: 900px;
            width: 100%;
            justify-content: center;
        }
        
        .panel {
            background: var(--card);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.6);
            flex: 1 1 350px;
            animation: slideUpFade 0.8s ease-out backwards;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .panel:nth-child(2) { animation-delay: 0.2s; }
        
        /* Efecto hover en los paneles */
        .panel:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.8);
        }

        label { display: block; margin-top: 12px; font-weight: 600; font-size: 0.85rem; color: #bbb; text-transform: uppercase; letter-spacing: 0.5px;}
        input, select, button {
            width: 100%; padding: 12px; margin-top: 8px;
            border-radius: 6px; border: 1px solid var(--accent);
            background: #2a2a2a; color: #fff; font-size: 1rem;
            box-sizing: border-box; transition: 0.3s;
        }
        input:focus, select:focus { 
            border-color: var(--highlight); 
            outline: none; 
            box-shadow: 0 0 8px rgba(255, 140, 0, 0.4);
        }
        
        button {
            background: var(--highlight); color: #fff; border: none;
            font-weight: bold; margin-top: 25px; cursor: pointer;
            font-size: 1.1rem; box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
        }
        button:hover { background: #ffa033; transform: scale(1.02); }
        button:disabled { background: #555; cursor: not-allowed; transform: scale(1); box-shadow: none; }
        
        /* Clase que se activa con JS para que el botón palpite */
        .loading-pulse {
            animation: pulseGlow 1.5s infinite;
            background: #ffa033 !important;
        }
        
        #result {
            margin-top: 20px; padding: 20px;
            background: #252525; border-radius: 8px;
            border-left: 5px solid var(--highlight);
            line-height: 1.6; font-size: 0.95rem;
            display: none; /* Oculto por defecto */
        }
        
        /* Clase para mostrar el resultado con animación */
        #result.show-result {
            display: block;
            animation: slideDownResult 0.6s ease-out forwards;
        }
        
        #result h1, #result h2, #result h3 { color: #fff; margin-top: 0; }
        #result strong { color: var(--highlight); }
        #result a { color: #4da6ff; text-decoration: none; font-weight: bold; transition: color 0.2s; }
        #result a:hover { text-decoration: underline; color: #80c1ff; }
        
        .training-board { text-align: center; }
        iframe {
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 400px;
            height: 444px;
            transition: box-shadow 0.3s;
        }
        iframe:hover { box-shadow: 0 6px 15px rgba(255, 140, 0, 0.2); }
    </style>
</head>
<body>

<div class="header">
    <h1>🔥 Pro Coach IA ♟️</h1>
    <p>Entrenamiento Avanzado & Táctica Integrada</p>
</div>

<div class="dashboard">
    <!-- Panel de Configuración -->
    <div class="panel">
        <label>🎮 Plataforma</label>
        <select id="platform">
            <option value="lichess">Lichess</option>
            <option value="chesscom">Chess.com</option>
        </select>

        <label>👤 Nombre de Usuario</label>
        <input type="text" id="username" placeholder="Ej: PepechuyJJHS">

        <label>🔑 API Key de Groq</label>
        <input type="password" id="apiKey" placeholder="gsk_...">

        <label>⏱️ Tiempo de estudio hoy</label>
        <select id="time">
            <option value="15 minutos">15 Minutos ⚡</option>
            <option value="30 minutos" selected>30 Minutos 🧠</option>
            <option value="60 minutos">1 Hora 💪</option>
        </select>

        <label>🎯 ¿Cuál es tu objetivo?</label>
        <select id="goal">
            <option value="Táctica avanzada y cálculo">Táctica y Cálculo 🧩</option>
            <option value="Repertorio de aperturas">Aperturas 📖</option>
            <option value="Finales técnicos">Finales 🏁</option>
        </select>

        <button id="btnGenerate" onclick="generatePlan()">🚀 Analizar Nivel y Generar Plan</button>
        
        <div id="result"></div>
    </div>

    <!-- Panel de Entrenamiento Integrado -->
    <div class="panel training-board">
        <label style="margin-bottom: 15px;">🧩 Tablero de Práctica (Puzzle del Día)</label>
        <iframe src="https://lichess.org/training/frame?theme=brown&bg=dark" allowtransparency="true" frameborder="0"></iframe>
        <p style="font-size: 0.8rem; color: #888; margin-top: 10px;">Haz clic en el tablero para ir directo al Puzzle del Día en Lichess. ✨</p>
    </div>
</div>

<script>
  document.getElementById('apiKey').value = localStorage.getItem('groq_key') || '';
  document.getElementById('username').value = localStorage.getItem('chess_user') || '';

  async function generatePlan() {
    const platform = document.getElementById('platform').value;
    const username = document.getElementById('username').value.trim();
    const apiKey = document.getElementById('apiKey').value.trim();
    const time = document.getElementById('time').value;
    const goal = document.getElementById('goal').value;
    const resultDiv = document.getElementById('result');
    const btn = document.getElementById('btnGenerate');

    if (!username || !apiKey) {
      alert("⚠️ Faltan datos jefe. Llena tu usuario y API Key.");
      return;
    }

    localStorage.setItem('groq_key', apiKey);
    localStorage.setItem('chess_user', username);
    
    // Activar animaciones de carga
    btn.disabled = true;
    btn.classList.add('loading-pulse');
    btn.innerText = "⏳ Extrayendo ELO y analizando...";
    resultDiv.classList.remove('show-result'); // Ocultar para que se vuelva a animar luego

    try {
      let statsSummary = "";

      if (platform === 'lichess') {
        const res = await fetch(`https://lichess.org/api/user/${username}`);
        if (!res.ok) throw new Error("Usuario de Lichess no encontrado.");
        const data = await res.json();
        statsSummary = `Blitz: ${data.perfs?.blitz?.rating || 'No clasificado'}, Rápido: ${data.perfs?.rapid?.rating || 'No clasificado'}, Puzzles: ${data.perfs?.puzzle?.rating || 'No clasificado'}`;
      } else {
        const res = await fetch(`https://api.chess.com/pub/player/${username}/stats`);
        if (!res.ok) throw new Error("Usuario de Chess.com no encontrado.");
        const data = await res.json();
        statsSummary = `Blitz: ${data.chess_blitz?.last?.rating || 'No clasificado'}, Rápido: ${data.chess_rapid?.last?.rating || 'No clasificado'}, Puzzles: ${data.tactics?.highest?.rating || 'No clasificado'}`;
      }

      const prompt = `Actúa como un Entrenador de Ajedrez de Élite carismático, súper motivador y estricto. 
ESTÁS HABLANDO DIRECTAMENTE CONMIGO (soy tu alumno). ¡Háblame de "tú", NUNCA en tercera persona! 
Yo juego en ${platform.toUpperCase()} y estas son mis estadísticas de ELO actuales: [${statsSummary}].

REGLAS ESTRICTAS PARA TU RESPUESTA:
1. OBLIGATORIO: Háblame directo ("tú tienes", "tu ELO es").
2. Usa bastantes emojis (🚀, 🔥, ♟️, 🧠, etc.) a lo largo de tu respuesta.
3. Menciona mi ELO numérico actual en el primer párrafo y sé brutalmente honesto evaluando mi nivel actual basándote en esos números.
4. Tienes ${time} para armar mi plan enfocado en: "${goal}".
5. PROHIBIDO dar consejos básicos (como "controla el centro"). Dame 1 variante de apertura específica o 1 patrón táctico avanzado con nombre adecuado a mi ELO numérico real.
6. ENLACE DE PRÁCTICA OBLIGATORIO: Al final de tu recomendación, proporcióname un enlace exacto y funcional de Lichess que coincida con el tema que me pusiste a estudiar (por ejemplo: https://lichess.org/training/mate, https://lichess.org/training/endgame, https://lichess.org/training/defensive, etc.).
7. CONSEJO EXTRA Y OBJETIVO: Cierra tu respuesta con una sección llamada "**💡 Consejo Extra:**" donde me des una directriz sumamente objetiva, fría y clara sobre cómo mejorar mi cálculo mental o mi postura psicológica frente al tablero, sin rodeos.
8. Usa formato Markdown limpio.`;

      const groqRes = await fetch('https://api.groq.com/openai/v1/chat/completions', {
        method: 'POST',
        headers: {
          'Authorization': `Bearer ${apiKey}`,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          model: 'llama-3.3-70b-versatile',
          messages: [{ role: 'user', content: prompt }],
          temperature: 0.6
        })
      });

      const groqData = await groqRes.json();

      if (groqData.error) throw new Error(groqData.error.message);

      const rawText = groqData.choices[0].message.content;
      
      const renderer = new marked.Renderer();
      renderer.link = function(href, title, text) {
        return `<a target="_blank" href="${href}">${text}</a>`;
      };
      
      resultDiv.innerHTML = marked.parse(rawText, { renderer: renderer });
      
      // Mostrar con animación
      resultDiv.classList.add('show-result');

    } catch (err) {
      alert("Error: " + err.message);
    } finally {
      // Quitar animaciones de carga
      btn.disabled = false;
      btn.classList.remove('loading-pulse');
      btn.innerText = "🚀 Analizar Nivel y Generar Plan";
    }
  }
</script>

</body>
</html>
