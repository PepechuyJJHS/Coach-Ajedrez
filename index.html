<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coach IA de Ajedrez V6 - Ultra Animado</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --card: #1e1e1eba;
            --text: #e0e0e0;
            --highlight: #ff8c00;
            --accent: #333333;
        }
        
        /* Animación del fondo */
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        body {
            /* Fondo animado oscuro con toques naranjas */
            background: linear-gradient(-45deg, #0a0a0a, #1f1100, #0a0a0a, #2b1500);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: var(--text);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            min-height: 100vh;
        }
        
        /* --- ANIMACIONES --- */
        @keyframes slideUpFade {
            0% { opacity: 0; transform: translateY(50px) scale(0.95); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        @keyframes pulseGlow {
            0% { box-shadow: 0 0 5px var(--highlight); transform: scale(1); }
            50% { box-shadow: 0 0 25px var(--highlight); transform: scale(1.05); }
            100% { box-shadow: 0 0 5px var(--highlight); transform: scale(1); }
        }
        @keyframes slideDownResult {
            0% { opacity: 0; transform: translateY(-30px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        @keyframes typingDots {
            0% { content: "."; }
            33% { content: ".."; }
            66% { content: "..."; }
            100% { content: ""; }
        }
        /* ------------------- */

        .header {
            text-align: center;
            margin-bottom: 25px;
            animation: slideUpFade 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        .header h1 { margin: 0; color: #fff; font-size: 2rem; text-shadow: 0 4px 15px rgba(255, 140, 0, 0.5); }
        .header p { color: #aaa; font-size: 0.95rem; margin-top: 5px; }
        
        .dashboard {
            display: flex;
            flex-wrap: wrap;
            gap: 25px;
            max-width: 950px;
            width: 100%;
            justify-content: center;
        }
        
        .panel {
            background: var(--card);
            backdrop-filter: blur(10px); /* Efecto cristal */
            -webkit-backdrop-filter: blur(10px);
            padding: 25px;
            border-radius: 16px;
            border: 1px solid rgba(255, 140, 0, 0.1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            flex: 1 1 350px;
            animation: slideUpFade 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .panel:nth-child(1) { animation-delay: 0.1s; }
        .panel:nth-child(2) { animation-delay: 0.3s; }
        
        .panel:hover {
            transform: translateY(-8px) scale(1.01);
            box-shadow: 0 20px 40px rgba(255, 140, 0, 0.15);
            border-color: rgba(255, 140, 0, 0.4);
        }

        label { display: block; margin-top: 15px; font-weight: 600; font-size: 0.85rem; color: #bbb; text-transform: uppercase; letter-spacing: 1px;}
        input, select, button {
            width: 100%; padding: 14px; margin-top: 8px;
            border-radius: 8px; border: 1px solid var(--accent);
            background: #222; color: #fff; font-size: 1rem;
            box-sizing: border-box; transition: all 0.3s ease;
        }
        
        input:focus, select:focus { 
            border-color: var(--highlight); 
            outline: none; 
            box-shadow: 0 0 12px rgba(255, 140, 0, 0.5);
            background: #2a2a2a;
            transform: scale(1.02);
        }
        
        button {
            background: linear-gradient(45deg, #ff8c00, #ff4500);
            color: #fff; border: none;
            font-weight: bold; margin-top: 30px; cursor: pointer;
            font-size: 1.1rem; box-shadow: 0 4px 15px rgba(255, 140, 0, 0.4);
            text-transform: uppercase; letter-spacing: 1px;
        }
        button:hover { 
            background: linear-gradient(45deg, #ffa033, #ff5722); 
            transform: translateY(-2px) scale(1.03); 
            box-shadow: 0 8px 25px rgba(255, 140, 0, 0.6);
        }
        button:disabled { background: #555; cursor: not-allowed; transform: none; box-shadow: none; color: #888;}
        
        .loading-pulse {
            animation: pulseGlow 1.5s infinite;
            background: #ff7300 !important;
            color: #fff !important;
        }

        /* Contenedor del texto "Escribiendo..." */
        .typing-indicator {
            display: none;
            text-align: center;
            color: var(--highlight);
            font-weight: bold;
            margin-top: 20px;
            font-size: 1.1rem;
        }
        .typing-indicator::after {
            content: "";
            animation: typingDots 1.5s infinite;
        }
        
        #result {
            margin-top: 20px; padding: 25px;
            background: rgba(37, 37, 37, 0.8); border-radius: 12px;
            border-left: 5px solid var(--highlight);
            line-height: 1.7; font-size: 1rem;
            display: none; 
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
        }
        
        #result.show-result {
            display: block;
            animation: slideDownResult 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        
        #result h1, #result h2, #result h3 { color: #fff; margin-top: 0; border-bottom: 1px solid #444; padding-bottom: 10px; }
        #result strong { color: var(--highlight); }
        #result a { 
            color: #ffaa44; text-decoration: none; font-weight: bold; 
            padding: 2px 6px; background: rgba(255,140,0,0.1); border-radius: 4px; transition: all 0.2s;
        }
        #result a:hover { background: rgba(255,140,0,0.3); color: #fff; box-shadow: 0 0 8px rgba(255,140,0,0.5); }
        
        .training-board { text-align: center; }
        iframe {
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
            width: 100%;
            max-width: 400px;
            height: 444px;
            transition: all 0.4s ease;
            border: 2px solid transparent;
        }
        iframe:hover { 
            box-shadow: 0 12px 30px rgba(255, 140, 0, 0.3); 
            border-color: rgba(255, 140, 0, 0.5);
            transform: scale(1.02);
        }
    </style>
</head>
<body>

<div class="header">
    <h1>🔥 Pro Coach IA ♟️</h1>
    <p>Entrenamiento Avanzado & Táctica Integrada</p>
</div>

<div class="dashboard">
    <!-- Panel de Configuración -->
    <div class="panel">
        <label>🎮 Plataforma</label>
        <select id="platform">
            <option value="lichess">Lichess</option>
            <option value="chesscom">Chess.com</option>
        </select>

        <label>👤 Nombre de Usuario</label>
        <input type="text" id="username" placeholder="Ej: PepechuyJJHS">

        <label>🔑 API Key de Groq</label>
        <input type="password" id="apiKey" placeholder="gsk_...">

        <label>⏱️ Tiempo de estudio hoy</label>
        <select id="time">
            <option value="15 minutos">15 Minutos ⚡</option>
            <option value="30 minutos" selected>30 Minutos 🧠</option>
            <option value="60 minutos">1 Hora 💪</option>
        </select>

        <label>🎯 ¿Cuál es tu objetivo?</label>
        <select id="goal">
            <option value="Táctica avanzada y cálculo">Táctica y Cálculo 🧩</option>
            <option value="Repertorio de aperturas">Aperturas 📖</option>
            <option value="Finales técnicos">Finales 🏁</option>
        </select>

        <button id="btnGenerate" onclick="generatePlan()">🚀 Analizar ELO</button>
        
        <!-- Indicador de que la IA está pensando -->
        <div id="typing" class="typing-indicator">El Coach está analizando tu perfil</div>

        <div id="result"></div>
    </div>

    <!-- Panel de Entrenamiento Integrado -->
    <div class="panel training-board">
        <label style="margin-bottom: 15px;">🧩 Tablero de Práctica (Puzzle del Día)</label>
        <iframe src="https://lichess.org/training/frame?theme=brown&bg=dark" allowtransparency="true" frameborder="0"></iframe>
        <p style="font-size: 0.8rem; color: #888; margin-top: 15px;">Haz clic en el tablero para ir directo al Puzzle del Día en Lichess. ✨</p>
    </div>
</div>

<script>
  document.getElementById('apiKey').value = localStorage.getItem('groq_key') || '';
  document.getElementById('username').value = localStorage.getItem('chess_user') || '';

  async function generatePlan() {
    const platform = document.getElementById('platform').value;
    const username = document.getElementById('username').value.trim();
    const apiKey = document.getElementById('apiKey').value.trim();
    const time = document.getElementById('time').value;
    const goal = document.getElementById('goal').value;
    const resultDiv = document.getElementById('result');
    const btn = document.getElementById('btnGenerate');
    const typingIndicator = document.getElementById('typing');

    if (!username || !apiKey) {
      alert("⚠️ Faltan datos jefe. Llena tu usuario y API Key.");
      return;
    }

    localStorage.setItem('groq_key', apiKey);
    localStorage.setItem('chess_user', username);
    
    // Activar animaciones de carga
    btn.disabled = true;
    btn.classList.add('loading-pulse');
    btn.innerText = "⏳ Extrayendo datos...";
    resultDiv.classList.remove('show-result');
    typingIndicator.style.display = "block"; // Mostrar "Escribiendo..."

    try {
      let statsSummary = "";

      if (platform === 'lichess') {
        const res = await fetch(`https://lichess.org/api/user/${username}`);
        if (!res.ok) throw new Error("Usuario de Lichess no encontrado.");
        const data = await res.json();
        statsSummary = `Blitz: ${data.perfs?.blitz?.rating || 'No clasificado'}, Rápido: ${data.perfs?.rapid?.rating || 'No clasificado'}, Puzzles: ${data.perfs?.puzzle?.rating || 'No clasificado'}`;
      } else {
        const res = await fetch(`https://api.chess.com/pub/player/${username}/stats`);
        if (!res.ok) throw new Error("Usuario de Chess.com no encontrado.");
        const data = await res.json();
        statsSummary = `Blitz: ${data.chess_blitz?.last?.rating || 'No clasificado'}, Rápido: ${data.chess_rapid?.last?.rating || 'No clasificado'}, Puzzles: ${data.tactics?.highest?.rating || 'No clasificado'}`;
      }

      const prompt = `Actúa como un Entrenador de Ajedrez de Élite carismático, súper motivador y estricto. 
ESTÁS HABLANDO DIRECTAMENTE CONMIGO (soy tu alumno). ¡Háblame de "tú", NUNCA en tercera persona! 
Yo juego en ${platform.toUpperCase()} y estas son mis estadísticas de ELO actuales: [${statsSummary}].

REGLAS ESTRICTAS PARA TU RESPUESTA:
1. OBLIGATORIO: Háblame directo ("tú tienes", "tu ELO es").
2. Usa bastantes emojis (🚀, 🔥, ♟️, 🧠, etc.) a lo largo de tu respuesta.
3. Menciona mi ELO numérico actual en el primer párrafo y sé brutalmente honesto evaluando mi nivel actual basándote en esos números.
4. Tienes ${time} para armar mi plan enfocado en: "${goal}".
5. PROHIBIDO dar consejos básicos (como "controla el centro"). Dame 1 variante de apertura específica o 1 patrón táctico avanzado con nombre adecuado a mi ELO numérico real.
6. ENLACE DE PRÁCTICA OBLIGATORIO: Al final de tu recomendación, proporcióname UN SOLO enlace funcional de Lichess que coincida con el tema (ejemplo: https://lichess.org/training/mate, https://lichess.org/training/endgame, etc.).
7. CONSEJO EXTRA Y OBJETIVO: Cierra tu respuesta con una sección llamada "**💡 Consejo Extra:**" donde me des una directriz sumamente objetiva, fría y clara sobre cómo mejorar mi cálculo mental o mi postura psicológica frente al tablero.
8. Usa formato Markdown limpio.`;

      const groqRes = await fetch('https://api.groq.com/openai/v1/chat/completions', {
        method: 'POST',
        headers: {
          'Authorization': `Bearer ${apiKey}`,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          model: 'llama-3.3-70b-versatile',
          messages: [{ role: 'user', content: prompt }],
          temperature: 0.6
        })
      });

      const groqData = await groqRes.json();

      if (groqData.error) throw new Error(groqData.error.message);

      const rawText = groqData.choices[0].message.content;
      
      // MÉTODO SEGURO: Convertir a HTML primero
      let parsedHTML = marked.parse(rawText);
      // Reemplazar TODAS las etiquetas de enlace para que abran en pestaña nueva (soluciona el bug de marked.js)
      parsedHTML = parsedHTML.replace(/<a /g, '<a target="_blank" ');
      
      resultDiv.innerHTML = parsedHTML;
      
      // Ocultar indicador y mostrar resultado
      typingIndicator.style.display = "none";
      resultDiv.classList.add('show-result');

    } catch (err) {
      alert("Error: " + err.message);
      typingIndicator.style.display = "none";
    } finally {
      // Quitar animaciones de carga
      btn.disabled = false;
      btn.classList.remove('loading-pulse');
      btn.innerText = "🚀 Analizar ELO";
    }
  }
</script>

</body>
</html>
