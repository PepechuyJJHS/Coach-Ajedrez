<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coach IA de Ajedrez V3</title>
    <!-- Librería para el texto de la IA -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg: #121212;
            --card: #1e1e1e;
            --text: #e0e0e0;
            --highlight: #ff8c00; /* Naranja vibrante */
            --accent: #333333;
        }
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .header h1 { margin: 0; color: #fff; font-size: 1.8rem; }
        .header p { color: #888; font-size: 0.9rem; }
        
        .dashboard {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            max-width: 900px;
            width: 100%;
            justify-content: center;
        }
        
        .panel {
            background: var(--card);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.6);
            flex: 1 1 350px;
        }

        label { display: block; margin-top: 12px; font-weight: 600; font-size: 0.85rem; color: #bbb; text-transform: uppercase; letter-spacing: 0.5px;}
        input, select, button {
            width: 100%; padding: 12px; margin-top: 8px;
            border-radius: 6px; border: 1px solid var(--accent);
            background: #2a2a2a; color: #fff; font-size: 1rem;
            box-sizing: border-box; transition: 0.3s;
        }
        input:focus, select:focus { border-color: var(--highlight); outline: none; }
        
        button {
            background: var(--highlight); color: #fff; border: none;
            font-weight: bold; margin-top: 25px; cursor: pointer;
            font-size: 1.1rem; box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        button:hover { background: #ffa033; } /* Naranja más claro al pasar el mouse */
        button:disabled { background: #555; cursor: not-allowed; }
        
        #result {
            margin-top: 20px; padding: 20px;
            background: #252525; border-radius: 8px;
            border-left: 5px solid var(--highlight);
            line-height: 1.6; font-size: 0.95rem;
        }
        
        #result h1, #result h2, #result h3 { color: #fff; margin-top: 0; }
        #result strong { color: var(--highlight); }
        
        .training-board {
            text-align: center;
        }
        iframe {
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 400px;
            height: 444px;
        }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="header">
    <h1>🔥 Pro Coach IA ♟️</h1>
    <p>Entrenamiento Avanzado & Táctica Integrada</p>
</div>

<div class="dashboard">
    <!-- Panel de Configuración -->
    <div class="panel">
        <label>🎮 Plataforma</label>
        <select id="platform">
            <option value="lichess">Lichess</option>
            <option value="chesscom">Chess.com</option>
        </select>

        <label>👤 Nombre de Usuario</label>
        <input type="text" id="username" placeholder="Ej: PepechuyJJHS">

        <label>🔑 API Key de Groq</label>
        <input type="password" id="apiKey" placeholder="gsk_...">

        <label>⏱️ Tiempo de estudio hoy</label>
        <select id="time">
            <option value="15 minutos">15 Minutos ⚡</option>
            <option value="30 minutos" selected>30 Minutos 🧠</option>
            <option value="60 minutos">1 Hora 💪</option>
        </select>

        <label>🎯 ¿Cuál es tu objetivo?</label>
        <select id="goal">
            <option value="Táctica avanzada y cálculo">Táctica y Cálculo 🧩</option>
            <option value="Repertorio de aperturas">Aperturas 📖</option>
            <option value="Finales técnicos">Finales 🏁</option>
        </select>

        <button id="btnGenerate" onclick="generatePlan()">🚀 Analizar Nivel y Generar Plan</button>
        
        <div id="result" class="hidden"></div>
    </div>

    <!-- Panel de Entrenamiento Integrado -->
    <div class="panel training-board">
        <label style="margin-bottom: 15px;">🧩 Tablero de Práctica (Puzzle del Día)</label>
        <iframe src="https://lichess.org/training/frame?theme=brown&bg=dark" allowtransparency="true" frameborder="0"></iframe>
        <p style="font-size: 0.8rem; color: #888; margin-top: 10px;">Resuelve el problema aquí mismo sin salir de la página. ✨</p>
    </div>
</div>

<script>
  document.getElementById('apiKey').value = localStorage.getItem('groq_key') || '';
  document.getElementById('username').value = localStorage.getItem('chess_user') || '';

  async function generatePlan() {
    const platform = document.getElementById('platform').value;
    const username = document.getElementById('username').value.trim();
    const apiKey = document.getElementById('apiKey').value.trim();
    const time = document.getElementById('time').value;
    const goal = document.getElementById('goal').value;
    const resultDiv = document.getElementById('result');
    const btn = document.getElementById('btnGenerate');

    if (!username || !apiKey) {
      alert("⚠️ Faltan datos jefe. Llena tu usuario y API Key.");
      return;
    }

    localStorage.setItem('groq_key', apiKey);
    localStorage.setItem('chess_user', username);
    btn.disabled = true;
    btn.innerText = "⏳ Extrayendo ELO y analizando...";
    resultDiv.classList.add('hidden');

    try {
      let statsSummary = "";

      if (platform === 'lichess') {
        const res = await fetch(`https://lichess.org/api/user/${username}`);
        if (!res.ok) throw new Error("Usuario de Lichess no encontrado.");
        const data = await res.json();
        statsSummary = `Blitz: ${data.perfs?.blitz?.rating || 'No clasificado'}, Rápido: ${data.perfs?.rapid?.rating || 'No clasificado'}, Puzzles: ${data.perfs?.puzzle?.rating || 'No clasificado'}`;
      } else {
        const res = await fetch(`https://api.chess.com/pub/player/${username}/stats`);
        if (!res.ok) throw new Error("Usuario de Chess.com no encontrado.");
        const data = await res.json();
        statsSummary = `Blitz: ${data.chess_blitz?.last?.rating || 'No clasificado'}, Rápido: ${data.chess_rapid?.last?.rating || 'No clasificado'}, Puzzles: ${data.tactics?.highest?.rating || 'No clasificado'}`;
      }

      // Prompt modificado para hablar en primera persona y usar emojis
      const prompt = `Actúa como un Entrenador de Ajedrez de Élite carismático, súper motivador y estricto. 
ESTÁS HABLANDO DIRECTAMENTE CONMIGO (soy tu alumno). ¡Háblame de "tú", NUNCA en tercera persona! 
Yo juego en ${platform.toUpperCase()} y estas son mis estadísticas de ELO actuales: [${statsSummary}].

REGLAS ESTRICTAS PARA TU RESPUESTA:
1. OBLIGATORIO: Háblame directo ("tú tienes", "tu ELO es").
2. Usa bastantes emojis (🚀, 🔥, ♟️, 🧠, etc.) a lo largo de tu respuesta para que sea divertida y súper dinámica.
3. Menciona mi ELO numérico actual en el primer párrafo y sé brutalmente honesto evaluando mi nivel actual basándote en esos números.
4. Tienes ${time} para armar mi plan enfocado en: "${goal}".
5. PROHIBIDO dar consejos básicos (como "controla el centro"). Dame 1 variante de apertura específica o 1 patrón táctico avanzado con nombre adecuado a mi ELO numérico real.
6. Usa formato Markdown limpio. Dime exactamente qué necesito para subir 100 puntos de ELO.`;

      const groqRes = await fetch('https://api.groq.com/openai/v1/chat/completions', {
        method: 'POST',
        headers: {
          'Authorization': `Bearer ${apiKey}`,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          model: 'llama-3.3-70b-versatile',
          messages: [{ role: 'user', content: prompt }],
          temperature: 0.6
        })
      });

      const groqData = await groqRes.json();

      if (groqData.error) throw new Error(groqData.error.message);

      const rawText = groqData.choices[0].message.content;
      resultDiv.innerHTML = marked.parse(rawText);
      resultDiv.classList.remove('hidden');

    } catch (err) {
      alert("Error: " + err.message);
    } finally {
      btn.disabled = false;
      btn.innerText = "🚀 Analizar Nivel y Generar Plan";
    }
  }
</script>

</body>
</html>
