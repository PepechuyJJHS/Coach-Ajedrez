<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔥 Chess + Groq Dashboard 🚀</title>
    <style>
        :root {
            --naranja-brillante: #ff6a00;
            --fondo-oscuro: #121212;
            --panel-fondo: #1e1e1e;
            --texto-claro: #ffffff;
        }

        body {
            background-color: var(--fondo-oscuro);
            color: var(--texto-claro);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 10px;
            box-sizing: border-box;
        }

        .contenedor {
            background: var(--panel-fondo);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 20px var(--naranja-brillante);
            text-align: center;
            width: 100%;
            max-width: 400px;
            animation: deslizarArriba 0.8s cubic-bezier(0.68, -0.55, 0.27, 1.55) forwards;
            transition: opacity 0.5s ease;
        }

        .oculto {
            display: none !important;
        }

        h2 {
            color: var(--naranja-brillante);
            text-shadow: 0 0 10px var(--naranja-brillante);
            margin-bottom: 20px;
        }

        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }

        label {
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
            color: #ccc;
            font-size: 14px;
        }

        input, textarea {
            width: 100%;
            padding: 10px;
            border: 2px solid #444;
            border-radius: 8px;
            background: #2a2a2a;
            color: white;
            outline: none;
            box-sizing: border-box;
            transition: 0.3s;
        }

        input:focus, textarea:focus {
            border-color: var(--naranja-brillante);
            box-shadow: 0 0 8px var(--naranja-brillante);
        }

        .link-api {
            display: block;
            margin-top: 5px;
            font-size: 12px;
            color: var(--naranja-brillante);
            text-decoration: none;
            text-align: right;
        }

        .link-api:hover {
            text-decoration: underline;
        }

        button {
            background: var(--naranja-brillante);
            color: white;
            border: none;
            padding: 12px 20px;
            width: 100%;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }

        .btn-principal {
            animation: latido 2s infinite;
        }

        button:hover {
            background: #ff8533;
            transform: scale(1.02);
            box-shadow: 0 0 15px var(--naranja-brillante);
        }

        .btn-secundario {
            background: #444;
            animation: none;
            margin-top: 15px;
        }

        .btn-secundario:hover {
            background: #666;
            box-shadow: none;
        }

        /* Pantalla Principal con Estructura Real */
        #pantalla-principal {
            width: 100%;
            max-width: 700px;
            background: var(--panel-fondo);
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(255, 106, 0, 0.4);
            animation: aparecer 0.6s ease-out forwards;
            box-sizing: border-box;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            margin-top: 15px;
        }

        .card {
            background: #252525;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #333;
            text-align: left;
        }

        .card h3 {
            color: var(--naranja-brillante);
            margin-top: 0;
            font-size: 16px;
        }

        #chat-output {
            background: #181818;
            padding: 10px;
            border-radius: 6px;
            height: 120px;
            overflow-y: auto;
            font-size: 13px;
            margin-bottom: 10px;
            border: 1px solid #333;
            white-space: pre-wrap;
        }

        @keyframes deslizarArriba {
            0% { transform: translateY(50px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }

        @keyframes latido {
            0% { transform: scale(1); }
            50% { transform: scale(1.01); }
            100% { transform: scale(1); }
        }
        
        @keyframes aparecer {
            0% { opacity: 0; transform: scale(0.95); }
            100% { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

    <!-- 🚪 PANTALLA DE LOGIN / CONFIGURACIÓN -->
    <div class="contenedor" id="pantalla-login">
        <h2>⚡ Conexión Épica ♟️</h2>
        
        <div class="input-group">
            <label for="chessUser">👑 Usuario de Chess.com:</label>
            <input type="text" id="chessUser" placeholder="Ej. PepechuyJJHS">
        </div>

        <div class="input-group">
            <label for="groqApi">🔑 API Key de Groq:</label>
            <input type="password" id="groqApi" placeholder="gsk_tUaP1k...">
            <a href="https://console.groq.com/keys" target="_blank" class="link-api">¿No tienes API? Créala aquí 🚀</a>
        </div>

        <button class="btn-principal" onclick="guardarDatos()">¡Vincular y Entrar! 🚀</button>
    </div>

    <!-- 🎮 PANTALLA PRINCIPAL (Estructura Funcional Real) -->
    <div id="pantalla-principal" class="oculto">
        <h2>🔥 Panel Central Chess + Groq ♟️</h2>
        <p>Conectado como: <strong id="nombre-mostrado" style="color: var(--naranja-brillante);">Jugador</strong></p>
        
        <div class="dashboard-grid">
            <!-- Tarjeta 1: Info de Chess.com -->
            <div class="card">
                <h3>📊 Perfil de Chess.com</h3>
                <div id="chess-info">Cargando datos del perfil... 🔄</div>
            </div>

            <!-- Tarjeta 2: Chat con la API de Groq -->
            <div class="card">
                <h3>🤖 Asistente Groq (IA)</h3>
                <div id="chat-output">Escribe un mensaje abajo para consultar a Groq usando tu API key...</div>
                <textarea id="prompt-groq" rows="2" placeholder="Ej. Dame un consejo táctico para ajedrez..."></textarea>
                <button onclick="consultarGroq()">Enviar a Groq ⚡</button>
            </div>
        </div>

        <button class="btn-secundario" onclick="cerrarSesion()">🔄 Cambiar API o Usuario</button>
    </div>

    <script>
        const pantallaLogin = document.getElementById("pantalla-login");
        const pantallaPrincipal = document.getElementById("pantalla-principal");
        const nombreMostrado = document.getElementById("nombre-mostrado");

        document.addEventListener("DOMContentLoaded", () => {
            const usuarioGuardado = localStorage.getItem("chessUser");
            const apiGuardada = localStorage.getItem("groqApi");

            if (usuarioGuardado && apiGuardada) {
                entrarAlDashboard(usuarioGuardado);
            }
        });

        function guardarDatos() {
            const chessUser = document.getElementById("chessUser").value.trim();
            const groqApi = document.getElementById("groqApi").value.trim();

            if (chessUser === "" || groqApi === "") {
                alert("⚠️ ¡Eh! Tienes que llenar ambos campos obligatoriamente.");
                return;
            }

            localStorage.setItem("chessUser", chessUser);
            localStorage.setItem("groqApi", groqApi);

            entrarAlDashboard(chessUser);
        }

        function entrarAlDashboard(usuario) {
            pantallaLogin.classList.add("oculto");
            pantallaPrincipal.classList.remove("oculto");
            nombreMostrado.textContent = usuario;
            
            // Cargar datos reales al entrar
            cargarPerfilChess(usuario);
        }

        // ♟️ Función para conectar con la API pública de Chess.com
        async function cargarPerfilChess(usuario) {
            const contenedorChess = document.getElementById("chess-info");
            contenedorChess.innerHTML = "Consultando Chess.com... ⏳";
            
            try {
                const response = await fetch(`https://api.chess.com/pub/player/${usuario}`);
                if (!response.ok) throw new Error("Usuario no encontrado");
                const data = await response.json();
                
                contenedorChess.innerHTML = `
                    <p>👤 <b>Nombre:</b> ${data.name || usuario}</p>
                    <p>🌟 <b>Estatus:</b> ${data.status}</p>
                    <p>🎯 <b>Seguidores:</b> ${data.followers}</p>
                    <a href="${data.url}" target="_blank" style="color: var(--naranja-brillante); font-size: 13px;">🔗 Ver perfil en Chess.com</a>
                `;
            } catch (error) {
                contenedorChess.innerHTML = `❌ No se pudo cargar el perfil de Chess.com. Revisa si el usuario '${usuario}' es correcto.`;
            }
        }

        // 🤖 Función para conectar y mandar peticiones reales a la API de Groq
        async function consultarGroq() {
            const apiKey = localStorage.getItem("groqApi");
            const promptTexto = document.getElementById("prompt-groq").value.trim();
            const salidaChat = document.getElementById("chat-output");

            if (!promptTexto) {
                alert("⚠️ Escribe algo para mandárselo a Groq.");
                return;
            }

            salidaChat.innerHTML += `\n\n<b>Tú:</b> ${promptTexto}`;
            document.getElementById("prompt-groq").value = "";
            salidaChat.innerHTML += `\n\n<i>Groq está pensando... 🧠</i>`;
            salidaChat.scrollTop = salidaChat.scrollHeight;

            try {
                const respuesta = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${apiKey}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: "llama-3.3-70b-versatile",
                        messages: [{ role: "user", content: promptTexto }]
                    })
                });

                const resultado = await respuesta.json();
                
                if (resultado.choices && resultado.choices.length > 0) {
                    const textoIA = resultado.choices[0].message.content;
                    // Limpiar el "pensando..." y mostrar respuesta
                    salidaChat.innerHTML = salidaChat.innerHTML.replace("<i>Groq está pensando... 🧠</i>", `\n<b>Groq:</b> ${textoIA}`);
                } else {
                    salidaChat.innerHTML = salidaChat.innerHTML.replace("<i>Groq está pensando... 🧠</i>", `\n❌ Error en la API Key o respuesta de Groq.`);
                }
            } catch (err) {
                salidaChat.innerHTML = salidaChat.innerHTML.replace("<i>Groq está pensando... 🧠</i>", `\n❌ Error de red al conectar con Groq.`);
            }
            salidaChat.scrollTop = salidaChat.scrollHeight;
        }

        function cerrarSesion() {
            localStorage.removeItem("chessUser");
            localStorage.removeItem("groqApi");
            
            document.getElementById("chessUser").value = "";
            document.getElementById("groqApi").value = "";

            pantallaPrincipal.classList.add("oculto");
            pantallaLogin.classList.remove("oculto");
        }
    </script>
</body>
</html>
