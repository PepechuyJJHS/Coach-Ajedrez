<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔥 Modo Dinámico Chess + Groq 🚀</title>
    <style>
        /* 🧡 Diseño Naranja Brillante y Dinámico */
        :root {
            --naranja-brillante: #ff6a00;
            --fondo-oscuro: #121212;
            --texto-claro: #ffffff;
        }

        body {
            background-color: var(--fondo-oscuro);
            color: var(--texto-claro);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .contenedor {
            background: #1e1e1e;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 20px var(--naranja-brillante);
            text-align: center;
            width: 350px;
            /* 🌀 Animación de entrada */
            animation: deslizarArriba 0.8s cubic-bezier(0.68, -0.55, 0.27, 1.55) forwards;
        }

        h2 {
            color: var(--naranja-brillante);
            text-shadow: 0 0 10px var(--naranja-brillante);
            margin-bottom: 20px;
        }

        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }

        label {
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
            color: #ccc;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 2px solid #444;
            border-radius: 8px;
            background: #2a2a2a;
            color: white;
            outline: none;
            box-sizing: border-box;
            transition: 0.3s;
        }

        input:focus {
            border-color: var(--naranja-brillante);
            box-shadow: 0 0 8px var(--naranja-brillante);
        }

        button {
            background: var(--naranja-brillante);
            color: white;
            border: none;
            padding: 12px 20px;
            width: 100%;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            /* ⚡ Animación de pulso constante */
            animation: latido 2s infinite;
        }

        button:hover {
            background: #ff8533;
            transform: scale(1.05);
            box-shadow: 0 0 15px var(--naranja-brillante);
        }

        #mensaje {
            margin-top: 15px;
            font-size: 14px;
            color: #00ff00;
            display: none;
            animation: aparecer 0.5s ease-in;
        }

        /* 🎬 Keyframes para las Animaciones */
        @keyframes deslizarArriba {
            0% { transform: translateY(100px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }

        @keyframes latido {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }

        @keyframes aparecer {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="contenedor">
        <h2>⚡ Conexión Épica ♟️</h2>
        
        <div class="input-group">
            <label for="chessUser">👑 Usuario de Chess.com / Lichess:</label>
            <input type="text" id="chessUser" placeholder="Ej. MagnusCarlsen">
        </div>

        <div class="input-group">
            <label for="groqApi">🔑 API Key de Groq:</label>
            <input type="password" id="groqApi" placeholder="gsk_tUaP1k...">
        </div>

        <button onclick="guardarDatos()">¡Vincular Datos! 🚀</button>
        
        <p id="mensaje">✅ ¡Datos guardados en este navegador! 🔥</p>
    </div>

    <script>
        // 🛠️ Al cargar la página, revisamos si ya hay datos guardados localmente
        document.addEventListener("DOMContentLoaded", () => {
            const usuarioGuardado = localStorage.getItem("chessUser");
            const apiGuardada = localStorage.getItem("groqApi");

            if (usuarioGuardado) document.getElementById("chessUser").value = usuarioGuardado;
            if (apiGuardada) document.getElementById("groqApi").value = apiGuardada;
        });

        // 💾 Función para guardar los datos
        function guardarDatos() {
            const chessUser = document.getElementById("chessUser").value;
            const groqApi = document.getElementById("groqApi").value;

            if (chessUser === "" || groqApi === "") {
                alert("⚠️ ¡Eh! Tienes que llenar ambos campos, no hagas trampa.");
                return;
            }

            // Guardado Local (Solo funciona en este dispositivo/navegador)
            // 🛑 RECORDATORIO: Para hacerlo multidispositivo, aquí tendrías que 
            // enviar estos datos a una Base de Datos (ej. Firebase) atados a un Login.
            localStorage.setItem("chessUser", chessUser);
            localStorage.setItem("groqApi", groqApi);

            // Mostrar mensaje de éxito con animación
            const msj = document.getElementById("mensaje");
            msj.style.display = "block";
            
            setTimeout(() => {
                msj.style.display = "none";
            }, 3000);
        }
    </script>

</body>
</html>
