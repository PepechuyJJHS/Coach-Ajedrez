<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔥 Modo Dinámico Chess + Groq 🚀</title>
    <style>
        /* 🧡 Diseño Naranja Brillante y Dinámico */
        :root {
            --naranja-brillante: #ff6a00;
            --fondo-oscuro: #121212;
            --texto-claro: #ffffff;
        }

        body {
            background-color: var(--fondo-oscuro);
            color: var(--texto-claro);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .contenedor {
            background: #1e1e1e;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 20px var(--naranja-brillante);
            text-align: center;
            width: 350px;
            /* 🌀 Animación de entrada */
            animation: deslizarArriba 0.8s cubic-bezier(0.68, -0.55, 0.27, 1.55) forwards;
            transition: opacity 0.5s ease;
        }

        /* Ocultar elementos suavemente */
        .oculto {
            display: none !important;
        }

        h2 {
            color: var(--naranja-brillante);
            text-shadow: 0 0 10px var(--naranja-brillante);
            margin-bottom: 20px;
        }

        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }

        label {
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
            color: #ccc;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 2px solid #444;
            border-radius: 8px;
            background: #2a2a2a;
            color: white;
            outline: none;
            box-sizing: border-box;
            transition: 0.3s;
        }

        input:focus {
            border-color: var(--naranja-brillante);
            box-shadow: 0 0 8px var(--naranja-brillante);
        }

        .link-api {
            display: block;
            margin-top: 5px;
            font-size: 12px;
            color: var(--naranja-brillante);
            text-decoration: none;
            text-align: right;
            transition: 0.2s;
        }

        .link-api:hover {
            color: #ff8533;
            text-decoration: underline;
        }

        button {
            background: var(--naranja-brillante);
            color: white;
            border: none;
            padding: 12px 20px;
            width: 100%;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }

        .btn-principal {
            animation: latido 2s infinite;
        }

        button:hover {
            background: #ff8533;
            transform: scale(1.05);
            box-shadow: 0 0 15px var(--naranja-brillante);
        }

        .btn-secundario {
            background: #444;
            animation: none;
            margin-top: 20px;
        }

        .btn-secundario:hover {
            background: #666;
            box-shadow: none;
        }

        /* 🎬 Keyframes para las Animaciones */
        @keyframes deslizarArriba {
            0% { transform: translateY(100px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }

        @keyframes latido {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }
        
        @keyframes aparecer {
            0% { opacity: 0; transform: scale(0.9); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* Estilo para la pantalla principal de la app */
        #pantalla-principal {
            width: 90%;
            max-width: 800px;
            height: 90vh;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 0 20px #000;
            animation: aparecer 0.6s ease-out forwards;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
    </style>
</head>
<body>

    <!-- 🚪 PANTALLA DE ENTRADA / VINCULACIÓN -->
    <div class="contenedor" id="pantalla-login">
        <h2>⚡ Conexión Épica ♟️</h2>
        
        <div class="input-group">
            <label for="chessUser">👑 Usuario de Chess.com / Lichess:</label>
            <input type="text" id="chessUser" placeholder="Ej. MagnusCarlsen">
        </div>

        <div class="input-group">
            <label for="groqApi">🔑 API Key de Groq:</label>
            <input type="password" id="groqApi" placeholder="gsk_tUaP1k...">
            <!-- AQUÍ ESTÁ EL LINK DE VUELTA -->
            <a href="https://console.groq.com/keys" target="_blank" class="link-api">¿No tienes API? Créala aquí 🚀</a>
        </div>

        <button class="btn-principal" onclick="guardarDatos()">¡Vincular Datos! 🚀</button>
    </div>

    <!-- 🎮 PANTALLA PRINCIPAL (Lo de "adentro") -->
    <div id="pantalla-principal" class="oculto">
        <h2>🔥 Panel Central ♟️</h2>
        <p>¡Bienvenido, <strong id="nombre-mostrado" style="color: var(--naranja-brillante);">Jugador</strong>! Tus datos están listos.</p>
        
        <div style="flex-grow: 1; width: 100%; border: 2px dashed #444; border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #666; margin: 20px 0;">
            <h3>🚧 Aquí va todo el resto de tu código y lógica (Tablero, Chat, etc.) 🚧</h3>
        </div>

        <button class="btn-secundario" onclick="cerrarSesion()">🔄 Cambiar API o Usuario</button>
    </div>

    <script>
        // Elementos de la interfaz
        const pantallaLogin = document.getElementById("pantalla-login");
        const pantallaPrincipal = document.getElementById("pantalla-principal");
        const nombreMostrado = document.getElementById("nombre-mostrado");

        // 🛠️ Al cargar, revisamos si ya hay datos
        document.addEventListener("DOMContentLoaded", () => {
            const usuarioGuardado = localStorage.getItem("chessUser");
            const apiGuardada = localStorage.getItem("groqApi");

            if (usuarioGuardado && apiGuardada) {
                // Si ya hay datos, saltamos directo a lo de "adentro"
                mostrarAppPrincipal(usuarioGuardado);
            }
        });

        // 💾 Guardar datos y pasar a la siguiente pantalla
        function guardarDatos() {
            const chessUser = document.getElementById("chessUser").value.trim();
            const groqApi = document.getElementById("groqApi").value.trim();

            if (chessUser === "" || groqApi === "") {
                alert("⚠️ ¡Eh! Tienes que llenar ambos campos para entrar.");
                return;
            }

            localStorage.setItem("chessUser", chessUser);
            localStorage.setItem("groqApi", groqApi);

            mostrarAppPrincipal(chessUser);
        }

        // 🎬 Transición a la pantalla principal
        function mostrarAppPrincipal(usuario) {
            pantallaLogin.classList.add("oculto");
            pantallaPrincipal.classList.remove("oculto");
            nombreMostrado.textContent = usuario;
        }

        // 🔄 Borrar datos y volver al inicio
        function cerrarSesion() {
            localStorage.removeItem("chessUser");
            localStorage.removeItem("groqApi");
            
            // Limpiar inputs
            document.getElementById("chessUser").value = "";
            document.getElementById("groqApi").value = "";

            // Cambiar pantallas
            pantallaPrincipal.classList.add("oculto");
            pantallaLogin.classList.remove("oculto");
        }
    </script>

</body>
</html>
